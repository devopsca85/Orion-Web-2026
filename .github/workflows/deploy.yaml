name: Deploy via Git Pull
on:
  push:
    branches:
      - develop
  workflow_dispatch:
concurrency:
  group: web26-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          export NVM_DIR="/root/.nvm"
          source "$NVM_DIR/nvm.sh"
          APP_DIR="/var/www/web26.customerdemourl.com"
          echo "Switching to project directory..."
          cd "${APP_DIR}"
          echo "Fixing git safe directory..."
          git config --global --add safe.directory ${APP_DIR}
          echo "Pulling latest code..."
          GIT_SSH_COMMAND='ssh -i /root/.ssh/id_rsa' git pull origin develop
          echo "Installing dependencies..."
          npm install
          echo "Building application..."
          npm run build
          echo "Restarting PM2..."
          pm2 restart web26.customerdemourl.com
          echo "Deployment completed!"
